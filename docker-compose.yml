services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: change-this-jwt-secret-in-production
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
