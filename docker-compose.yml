services:
  backend:
    build: ./backend
    container_name: stevechat-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stevechat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JWT_SECRET: change-this-to-a-64-char-base64-secret-min-32-chars-long
      JWT_EXPIRATION_MS: 86400000
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: stevechat-frontend
    ports:
      - "5173:5173" # Vite default, or 3000:3000 if CRA
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: stevechat-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stevechat
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p", "rootpassword"]
      interval: 5s
      retries: 10

volumes:
  db-data: