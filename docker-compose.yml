version: "3.8"

services:
  backend:
    build: .
    container_name: stevechat-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stevechat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 
      JWT_SECRET: rodriguez
      JWT_EXPIRATION_MS: 86400000
      FRONTEND_URL: http://localhost:5173
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - db
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stevechat-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: stevechat-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stevechat
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
