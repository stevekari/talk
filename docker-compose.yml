version: "3.8"

services:
  stevechat:
    build: .
    container_name: stevechat
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:h2:file:./data/stevechat;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      JWT_SECRET: local-dev-secret
      FRONTEND_URL: http://localhost:8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - ./data:/app/data
