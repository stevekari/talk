server.port=${PORT:8080}
server.error.include-message=always

# ============================
# CORS
# ============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ============================
# Database (H2 file-based)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/stevechat;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false

# ============================
# JWT
# ============================
jwt.secret=${JWT_SECRET:change-this-jwt-secret-in-production-please-change}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================
# Frontend URL
# ============================
frontend.url=${FRONTEND_URL:http://localhost:5173}
