server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# H2 in-memory database (swap to MySQL/Postgres later using database/schema.sql)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:stevechat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:change-this-jwt-secret-in-production-please-change}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Surface real exception messages on error responses (safety net for unhandled errors)
server.error.include-message=always
